services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mindline}
      MYSQL_USER: ${MYSQL_USER:-mindline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindline_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-mindline}:${MYSQL_PASSWORD:-mindline_dev_password}@mysql:3306/${MYSQL_DATABASE:-mindline}?charset=utf8mb4
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      HANDWRITING_LLM_MODE: ${HANDWRITING_LLM_MODE:-mock}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5-7b-instruct}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-20}
      QWEN_MAX_ATTEMPTS: ${QWEN_MAX_ATTEMPTS:-3}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mysql_data:
