version: 1
name: handwriting-analysis
description: 笔迹行为特征的客观提取与非诊断性探索流程
steps:
  - id: validate
    action: validate_schema
    input_schema: backend/app/contracts/schemas/handwriting-trace.schema.json
  - id: observe
    action: extract_observable_features
    service: backend.app.services.handwriting.analyzer
    safety: behavior_only
  - id: retrieve
    action: retrieve_reviewed_knowledge
    tool: get_rag_context
  - id: explain
    action: invoke_llm
    prompt: research/ai/prompts/handwriting-analysis-agent-v1.md
    safety: non_diagnostic
  - id: persist
    action: save_observation_record
    tool: save_handwriting_record
    requires_consent: true
