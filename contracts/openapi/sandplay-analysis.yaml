openapi: "3.0.3"
info:
  title: 心迹AI - 沙盘分析接口
  description: AI沙盘模块分析API，接收沙盘布局数据进行几何特征提取和Agent分析
  version: "1.0.0"
  contact:
    name: 角色B - 多模态算法与Agent工程

servers:
  - url: /api/v1
    description: 本地开发环境（通过Mock Adapter）
  - url: https://<kingdee-tenant>/api/v1
    description: 金蝶AI苍穹环境（待迁移）

paths:
  /sandplay/analyze:
    post:
      operationId: analyzeSandplay
      summary: 分析沙盘布局
      description: |
        接收用户在Canvas上摆放的沙盘元素列表及文字描述，
        返回几何特征统计和Agent分析结果。
        同一sessionId+timestamp的重复请求返回缓存结果（幂等）。
      tags:
        - Sandplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandplayAnalysisRequest"
            examples:
              normal:
                summary: 典型沙盘布局
                value:
                  sessionId: "sess-20240716-001"
                  timestamp: "2024-07-16T10:30:00Z"
                  elements:
                    - instanceId: "inst-001"
                      elementId: "tree-oak"
                      category: "植物"
                      x: 120.5
                      y: 300.0
                      rotation: 0
                      scale: 1.0
                      zIndex: 1
                    - instanceId: "inst-002"
                      elementId: "person-adult"
                      category: "人物"
                      x: 400.0
                      y: 250.0
                      rotation: 15
                      scale: 1.2
                      zIndex: 2
                  userDescription: "一棵大树旁边有一个人，感觉在散步"
      responses:
        "200":
          description: 分析成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandplayAnalysisResponse"
        "400":
          description: 输入验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "SANDBOX_INVALID_INPUT"
                message: "元素坐标超出有效范围（0-800, 0-600）"
                details:
                  - field: "elements[2].x"
                    reason: "x=850 exceeds max 800"
        "422":
          description: 空画布（无元素且无描述）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: "SANDBOX_EMPTY_CANVAS"
                message: "画布为空，请至少放置一个元素或填写文字描述"
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SandplayAnalysisRequest:
      type: object
      required:
        - sessionId
        - elements
      properties:
        sessionId:
          type: string
          description: 会话标识，与timestamp组合作为幂等键
          example: "sess-20240716-001"
        timestamp:
          type: string
          format: date-time
          description: 请求时间戳，与sessionId组合作为幂等键
          example: "2024-07-16T10:30:00Z"
        elements:
          type: array
          description: 画布上的所有沙盘元素
          items:
            $ref: "#/components/schemas/SandplayElement"
        userDescription:
          type: string
          maxLength: 500
          description: 用户对沙盘作品的文字说明（可选）
          example: "一棵大树旁边有一个人，感觉在散步"

    SandplayElement:
      type: object
      required:
        - instanceId
        - elementId
        - category
        - x
        - y
      properties:
        instanceId:
          type: string
          description: 画布上的元素实例唯一ID
          example: "inst-001"
        elementId:
          type: string
          description: 元素库中的元素定义ID
          example: "tree-oak"
        category:
          type: string
          description: 元素类别
          enum:
            - "人物"
            - "动物"
            - "建筑"
            - "植物"
            - "自然"
            - "交通工具"
            - "抽象符号"
        x:
          type: number
          minimum: 0
          maximum: 800
          description: 元素中心点的X坐标（逻辑单位）
        y:
          type: number
          minimum: 0
          maximum: 600
          description: 元素中心点的Y坐标（逻辑单位）
        rotation:
          type: number
          minimum: 0
          maximum: 360
          default: 0
          description: 旋转角度（度）
        scale:
          type: number
          minimum: 0.2
          maximum: 3.0
          default: 1.0
          description: 缩放比例
        zIndex:
          type: integer
          minimum: 0
          default: 0
          description: 层级顺序

    SandplayAnalysisResponse:
      type: object
      properties:
        analysisId:
          type: string
          description: 本次分析的唯一标识
          example: "analysis-sand-20240716-001"
        geometricFeatures:
          $ref: "#/components/schemas/GeometricFeatures"
        agentAnalysis:
          $ref: "#/components/schemas/SandplayAgentAnalysis"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string
          format: date-time

    GeometricFeatures:
      type: object
      properties:
        totalElements:
          type: integer
          description: 总元素数
        categoryDistribution:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              proportion:
                type: number
          description: 各类别元素数量和占比
          example:
            "人物":
              count: 3
              proportion: 0.25
            "植物":
              count: 5
              proportion: 0.42
        quadrantAnalysis:
          type: object
          properties:
            upperLeft:
              $ref: "#/components/schemas/QuadrantStats"
            upperRight:
              $ref: "#/components/schemas/QuadrantStats"
            lowerLeft:
              $ref: "#/components/schemas/QuadrantStats"
            lowerRight:
              $ref: "#/components/schemas/QuadrantStats"
        clusters:
          type: array
          items:
            type: object
            properties:
              clusterId:
                type: integer
              elementCount:
                type: integer
              centerX:
                type: number
              centerY:
                type: number
              memberInstanceIds:
                type: array
                items:
                  type: string
        adjacencyEdges:
          type: array
          items:
            type: object
            properties:
              elementA:
                type: string
              elementB:
                type: string
              distance:
                type: number

    QuadrantStats:
      type: object
      properties:
        elementCount:
          type: integer
        categories:
          type: array
          items:
            type: string
        categoryDiversity:
          type: integer
          description: 不同类别的数量

    SandplayAgentAnalysis:
      type: object
      required:
        - themeSummary
        - explorationQuestions
        - disclaimer
      properties:
        themeSummary:
          type: string
          description: Agent生成的沙盘主题摘要（描述可观察结构模式）
        explorationQuestions:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
          description: 自我探索问题列表
        disclaimer:
          type: string
          description: 免责声明
          example: "仅供自我探索和辅助参考，不构成心理诊断"

    Citation:
      type: object
      properties:
        docId:
          type: string
        title:
          type: string

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码
        message:
          type: string
          description: 人类可读的错误描述
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
