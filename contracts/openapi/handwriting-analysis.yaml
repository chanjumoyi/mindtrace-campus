openapi: "3.0.3"
info:
  title: MindLine Handwriting Analysis API
  description: Accepts the complete JSON trace exported by the handwriting collector and returns explainable behavioural observations. It must not be used for diagnosis or personality inference.
  version: "2.0.0"

servers:
  - url: /api/v1
    description: Local development and Kingdee gateway path

paths:
  /handwriting/analyze:
    post:
      operationId: analyzeHandwriting
      summary: Analyse an online handwriting trace
      tags: [Handwriting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandwritingAnalysisRequest"
      responses:
        "200":
          description: Analysis completed; inspect data.status for data sufficiency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid or insufficient trace structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Analysis service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HandwritingAnalysisRequest:
      type: object
      required: [trace]
      properties:
        requestId:
          type: string
        includeLlm:
          type: boolean
          default: true
          description: Generate a safe Qwen explanation; falls back to deterministic Mock when unavailable
        trace:
          $ref: "../schemas/handwriting-trace.schema.json"
    SuccessEnvelope:
      type: object
      required: [success, code, message, data, requestId, timestamp]
      properties:
        success: { type: boolean, enum: [true] }
        code: { type: string, example: "OK" }
        message: { type: string }
        data:
          $ref: "../schemas/handwriting-analysis-result.schema.json"
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [success, code, message, timestamp]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string }
        message: { type: string }
        data: { nullable: true }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
