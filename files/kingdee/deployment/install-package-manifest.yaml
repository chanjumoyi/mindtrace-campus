product: 心迹AI
component: C-公共基础与苍穹集成
version: 1.1.0
owner: C
containsABBusinessImplementation: false
packageOrder:
  - common-domain-models
  - roles-and-data-permissions
  - service-model-openapi
  - java-plugin-core-and-tenant-wrapper
  - kwc-common-shell
  - agent-tool-registration
  - deployment-configuration
  - tenant-native-product-export
requiredEnvironmentFacts:
  - tenantId
  - platformVersion
  - kwcVersion
  - javaSdkVersion
  - jdkVersion
  - agentPlatformVersion
  - availableModelGateway
  - attachmentStoragePolicy
  - productPackageExportFormat
secrets:
  committedToRepository: false
  minimumServiceTokenCharacters: 32
  storage: 苍穹密钥管理或部署环境变量
validation:
  staticAcceptance: tests/run_c_static_acceptance.py
  java8PluginCore: kingdee/java-plugin/scripts/verify-java8.sh
  kwc: npm --prefix kingdee/kwc-common run package
  localBackend: mvn -f local/backend/pom.xml test
  liveE2E: tests/e2e/run_c_e2e.py
  tenantPreflight: kingdee/deployment/preflight.py
rollback:
  database: 发布前备份；网关镜像和数据库迁移按版本整体回退
  platformAssets: 保留上一版平台原生产品安装包并在干净租户做回滚演练
  gateway: 回滚到上一镜像标签并轮换服务令牌
