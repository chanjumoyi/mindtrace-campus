application: xinji-ai
owner: C
version: 1.1.0
scope: 公共框架、数据底座、苍穹适配、系统集成
assetState: import-ready-specification
platformExportRequired: true
notes:
  - 本文件只包含 C 的公共模型，不包含 A 的笔迹模型，也不包含 B 的房树人、沙盘和 Agent 业务模型。
  - import-ready-specification 表示字段、索引、权限和生命周期已冻结；仍需在登录后的苍穹租户创建并导出平台原生安装资产。
  - 所有敏感正文、原始 Prompt、访问令牌均禁止进入日志模型。
roles:
  - code: XJ_STUDENT
    dataScope: SELF
  - code: XJ_COUNSELOR
    dataScope: AUTHORIZED_STUDENTS
  - code: XJ_ADMIN
    dataScope: ALL
  - code: XJ_INTEGRATION_SERVICE
    dataScope: SERVICE_ONLY
models:
  - code: xj_user
    name: 用户公共资料
    sourceTable: app_user
    dataLevel: L2
    primaryKey: id
    indexes: [username_unique, status]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: username, type: text, length: 80, required: true, unique: true}
      - {code: display_name, type: text, length: 100, required: true}
      - {code: email, type: text, length: 180, required: false}
      - {code: status, type: enum, values: [ACTIVE, DISABLED], required: true}
      - {code: created_at, type: datetime, required: true}
      - {code: updated_at, type: datetime, required: true}
      - {code: version, type: long, required: true, optimisticLock: true}
    permissions:
      XJ_STUDENT: [read-self, update-self]
      XJ_COUNSELOR: [read-authorized]
      XJ_ADMIN: [read-all, update-all]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_common_task
    name: 通用异步任务
    sourceTable: common_task
    dataLevel: L2
    primaryKey: id
    workflow: PENDING -> RUNNING -> SUCCEEDED|FAILED|CANCELLED; FAILED|CANCELLED -> PENDING
    indexes: [owner_created_at, module_status]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: owner_user_id, type: text, length: 36, required: false}
      - {code: module_code, type: text, length: 50, required: true}
      - {code: task_type, type: text, length: 80, required: true}
      - {code: title, type: text, length: 180, required: true}
      - {code: status, type: enum, values: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED], required: true}
      - {code: progress, type: integer, min: 0, max: 100, required: true}
      - {code: request_ref, type: text, length: 200, required: false}
      - {code: result_ref, type: text, length: 200, required: false}
      - {code: error_code, type: text, length: 80, required: false}
      - {code: error_message, type: text, length: 500, required: false}
      - {code: version, type: long, required: true, optimisticLock: true}
      - {code: created_at, type: datetime, required: true}
      - {code: updated_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: [create-self, read-self, update-self]
      XJ_COUNSELOR: [create, read-authorized, update-authorized]
      XJ_ADMIN: [create, read-all, update-all]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_file_object
    name: 通用文件对象
    sourceTable: file_object
    dataLevel: L2-L4
    primaryKey: id
    indexes: [owner_created_at, module_created_at, sha256]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: owner_user_id, type: text, length: 36, required: true}
      - {code: module_code, type: text, length: 50, required: true}
      - {code: original_name, type: text, length: 255, required: true}
      - {code: content_type, type: text, length: 120, required: true}
      - {code: size_bytes, type: long, required: true}
      - {code: sha256, type: text, length: 64, required: true}
      - {code: sensitivity_level, type: enum, values: [L1, L2, L3, L4], required: true}
      - {code: storage_ref, type: attachment, required: true}
      - {code: metadata_json, type: longtext, required: false}
      - {code: created_at, type: datetime, required: true}
      - {code: deleted_at, type: datetime, required: false}
    permissions:
      XJ_STUDENT: [create-self, read-self, delete-self]
      XJ_COUNSELOR: [create, read-authorized, delete-authorized]
      XJ_ADMIN: [create, read-all, delete-all]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_audit_log
    name: 操作审计
    sourceTable: audit_log
    dataLevel: L3
    primaryKey: id
    immutableForBusinessUsers: true
    retentionDays: 180
    indexes: [actor_time, resource, request_id]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: actor_user_id, type: text, length: 36, required: false}
      - {code: actor_username, type: text, length: 80, required: false}
      - {code: action, type: text, length: 120, required: true}
      - {code: resource_type, type: text, length: 80, required: true}
      - {code: resource_id, type: text, length: 100, required: false}
      - {code: result, type: enum, values: [SUCCESS, FAILED], required: true}
      - {code: request_id, type: text, length: 100, required: false}
      - {code: ip_address, type: text, length: 80, required: false}
      - {code: detail_json, type: longtext, required: false, sensitiveFieldsForbidden: true}
      - {code: occurred_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: []
      XJ_COUNSELOR: []
      XJ_ADMIN: [read-all, export]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_idempotency_record
    name: 幂等记录
    sourceTable: idempotency_record
    dataLevel: L3
    primaryKey: id
    businessUiVisible: false
    indexes: [scope_key_unique, expiry, state_lease]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: scope, type: text, length: 80, required: true}
      - {code: idempotency_key, type: text, length: 120, required: true}
      - {code: request_hash, type: text, length: 64, required: true}
      - {code: state, type: enum, values: [PROCESSING, COMPLETED, FAILED], required: true}
      - {code: response_status, type: integer, required: false}
      - {code: response_body, type: longtext, required: false, encryptedOrRestricted: true}
      - {code: source_call_id, type: text, length: 36, required: false}
      - {code: last_error_code, type: text, length: 80, required: false}
      - {code: recovery_count, type: integer, required: true}
      - {code: lease_until, type: datetime, required: false}
      - {code: expires_at, type: datetime, required: true}
      - {code: version, type: long, required: true, optimisticLock: true}
      - {code: created_at, type: datetime, required: true}
      - {code: updated_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: []
      XJ_COUNSELOR: []
      XJ_ADMIN: [read-metadata]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_ai_call_log
    name: AI调用日志
    sourceTable: ai_call_log
    dataLevel: L3
    primaryKey: id
    storesRawPrompt: false
    retentionDays: 180
    indexes: [actor_time, request_id, status_time, parent_call]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: actor_user_id, type: text, length: 36, required: false}
      - {code: module_code, type: text, length: 50, required: true}
      - {code: operation, type: text, length: 100, required: true}
      - {code: provider_mode, type: text, length: 40, required: true}
      - {code: status, type: enum, values: [PROCESSING, SUCCEEDED, FAILED, RATE_LIMITED, REPLAYED], required: true}
      - {code: attempts, type: integer, required: true}
      - {code: timeout_ms, type: integer, required: true}
      - {code: latency_ms, type: long, required: true}
      - {code: total_backoff_ms, type: long, required: true}
      - {code: http_status, type: integer, required: false}
      - {code: replayed, type: boolean, required: true}
      - {code: parent_call_id, type: text, length: 36, required: false}
      - {code: request_id, type: text, length: 100, required: false}
      - {code: idempotency_key, type: text, length: 120, required: false, masked: true}
      - {code: input_digest, type: text, length: 64, required: false}
      - {code: output_digest, type: text, length: 64, required: false}
      - {code: error_code, type: text, length: 80, required: false}
      - {code: error_message, type: text, length: 500, required: false, secretsRedacted: true}
      - {code: started_at, type: datetime, required: true}
      - {code: completed_at, type: datetime, required: false}
      - {code: created_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: [read-self]
      XJ_COUNSELOR: [read-self]
      XJ_ADMIN: [read-all, export]
      XJ_INTEGRATION_SERVICE: [read-self]

  - code: xj_ai_call_attempt_log
    name: AI调用重试明细
    sourceTable: ai_call_attempt_log
    dataLevel: L3
    primaryKey: id
    storesRawPrompt: false
    retentionDays: 180
    indexes: [call_attempt_unique]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: call_id, type: text, length: 36, required: true}
      - {code: attempt_no, type: integer, required: true}
      - {code: status, type: text, length: 30, required: true}
      - {code: latency_ms, type: long, required: true}
      - {code: http_status, type: integer, required: false}
      - {code: retryable, type: boolean, required: true}
      - {code: backoff_ms, type: long, required: true}
      - {code: error_code, type: text, length: 80, required: false}
      - {code: error_message, type: text, length: 500, required: false, secretsRedacted: true}
      - {code: started_at, type: datetime, required: true}
      - {code: completed_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: [read-parent-self]
      XJ_COUNSELOR: [read-parent-self]
      XJ_ADMIN: [read-all]
      XJ_INTEGRATION_SERVICE: [read-parent-self]

  - code: xj_ai_rate_limit_bucket
    name: AI限流窗口
    sourceTable: ai_rate_limit_bucket
    dataLevel: L3
    primaryKey: id
    businessUiVisible: false
    indexes: [scope_window_unique, expiry]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: scope, type: text, length: 180, required: true}
      - {code: window_start, type: datetime, required: true}
      - {code: request_count, type: integer, required: true}
      - {code: expires_at, type: datetime, required: true}
      - {code: version, type: long, required: true, optimisticLock: true}
    permissions:
      XJ_STUDENT: []
      XJ_COUNSELOR: []
      XJ_ADMIN: [read-metadata]
      XJ_INTEGRATION_SERVICE: []

  - code: xj_module_registration
    name: 模块注册
    sourceTable: module_registration
    dataLevel: L2
    primaryKey: id
    indexes: [module_code_unique]
    fields:
      - {code: id, type: text, length: 36, required: true, unique: true}
      - {code: module_code, type: text, length: 50, required: true, unique: true}
      - {code: module_name, type: text, length: 120, required: true}
      - {code: owner_code, type: enum, values: [A, B, C], required: true}
      - {code: base_url, type: text, length: 500, required: false}
      - {code: health_path, type: text, length: 200, required: false}
      - {code: enabled, type: boolean, required: true}
      - {code: status, type: text, length: 30, required: true}
      - {code: contract_version, type: text, length: 30, required: true}
      - {code: last_checked_at, type: datetime, required: false}
      - {code: updated_at, type: datetime, required: true}
    permissions:
      XJ_STUDENT: [read]
      XJ_COUNSELOR: [read]
      XJ_ADMIN: [read, create, update]
      XJ_INTEGRATION_SERVICE: [read]
