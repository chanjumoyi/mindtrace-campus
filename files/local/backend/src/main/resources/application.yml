server:
  port: 8080
  shutdown: graceful
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

spring:
  application:
    name: xinji-foundation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xinji}
    username: ${DB_USERNAME:xinji}
    password: ${DB_PASSWORD:xinji_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    com.xinji.foundation: INFO

xinji:
  auth:
    token-ttl-hours: ${APP_TOKEN_TTL_HOURS:12}
    service-token: ${APP_SERVICE_TOKEN:}
    service-account-id: ${APP_SERVICE_ACCOUNT_ID:kingdee-service}
    service-account-username: ${APP_SERVICE_ACCOUNT_USERNAME:kingdee_service}
    service-account-display-name: ${APP_SERVICE_ACCOUNT_DISPLAY_NAME:苍穹集成服务}
    service-permissions: ${APP_SERVICE_PERMISSIONS:ai:invoke,ai:log:read,module:read}
  storage:
    root: ${APP_STORAGE_ROOT:./storage}
    allowed-content-types:
      - image/png
      - image/jpeg
      - application/pdf
      - text/plain
      - application/json
  agent:
    base-url: ${APP_AGENT_BASE_URL:http://localhost:8090}
    timeout-ms: ${APP_AGENT_TIMEOUT_MS:5000}
    min-timeout-ms: ${APP_AGENT_MIN_TIMEOUT_MS:200}
    connect-timeout-ms: ${APP_AGENT_CONNECT_TIMEOUT_MS:1500}
    per-attempt-timeout-ms: ${APP_AGENT_PER_ATTEMPT_TIMEOUT_MS:2500}
    max-attempts: ${APP_AGENT_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${APP_AGENT_RETRY_BACKOFF_MS:200}
    retry-max-backoff-ms: ${APP_AGENT_RETRY_MAX_BACKOFF_MS:1500}
    retry-jitter-ms: ${APP_AGENT_RETRY_JITTER_MS:100}
    rate-limit-max-requests: ${APP_AGENT_RATE_LIMIT_MAX_REQUESTS:60}
    rate-limit-window-seconds: ${APP_AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
    idempotency-ttl-hours: ${APP_AGENT_IDEMPOTENCY_TTL_HOURS:24}
    idempotency-lease-grace-ms: ${APP_AGENT_IDEMPOTENCY_LEASE_GRACE_MS:3000}
    cleanup-interval-ms: ${APP_AGENT_CLEANUP_INTERVAL_MS:300000}
    max-response-bytes: ${APP_AGENT_MAX_RESPONSE_BYTES:2097152}
  handwriting:
    base-url: ${APP_HANDWRITING_BASE_URL:http://localhost:8091}
    timeout-ms: ${APP_HANDWRITING_TIMEOUT_MS:30000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
    student-password: ${APP_DEMO_STUDENT_PASSWORD:demo123}
    counselor-password: ${APP_DEMO_COUNSELOR_PASSWORD:demo123}
    admin-password: ${APP_DEMO_ADMIN_PASSWORD:admin123}
