spring:
  datasource:
    url: jdbc:h2:mem:xinji;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
xinji:
  storage:
    root: ./target/test-storage
  demo:
    enabled: true
    student-password: demo123
    counselor-password: demo123
    admin-password: admin123
  agent:
    base-url: http://127.0.0.1:65530
    timeout-ms: 1000
    min-timeout-ms: 100
    connect-timeout-ms: 200
    per-attempt-timeout-ms: 300
    max-attempts: 3
    retry-backoff-ms: 10
    retry-max-backoff-ms: 20
    retry-jitter-ms: 0
    rate-limit-max-requests: 2
    rate-limit-window-seconds: 60
    cleanup-interval-ms: 3600000
