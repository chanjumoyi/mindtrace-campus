services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xinji}
      POSTGRES_USER: ${POSTGRES_USER:-xinji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xinji_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xinji} -d ${POSTGRES_DB:-xinji}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mock-agent:
    build:
      context: ./local/mock-agent
    environment:
      PORT: 8090
    ports:
      - "8090:8090"

  handwriting-service:
    build:
      context: .
      dockerfile: local/ai-lab/handwriting/service/Dockerfile
    environment:
      HANDWRITING_LLM_MODE: ${HANDWRITING_LLM_MODE:-mock}
      HANDWRITING_MODEL_PATH: /app/models/handwriting_ridge_v0.1.json
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5-7b-instruct}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-20}
    volumes:
      - ./data/handwriting-private/models:/app/models:ro
    ports:
      - "8091:8091"

  backend:
    build:
      context: ./local/backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-agent:
        condition: service_started
      handwriting-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xinji}
      DB_USERNAME: ${POSTGRES_USER:-xinji}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-xinji_dev_password}
      APP_DEMO_STUDENT_PASSWORD: ${APP_DEMO_STUDENT_PASSWORD:-demo123}
      APP_DEMO_COUNSELOR_PASSWORD: ${APP_DEMO_COUNSELOR_PASSWORD:-demo123}
      APP_DEMO_ADMIN_PASSWORD: ${APP_DEMO_ADMIN_PASSWORD:-admin123}
      APP_TOKEN_TTL_HOURS: ${APP_TOKEN_TTL_HOURS:-12}
      APP_SERVICE_TOKEN: ${APP_SERVICE_TOKEN:-}
      APP_SERVICE_ACCOUNT_ID: ${APP_SERVICE_ACCOUNT_ID:-kingdee-service}
      APP_SERVICE_ACCOUNT_USERNAME: ${APP_SERVICE_ACCOUNT_USERNAME:-kingdee_service}
      APP_SERVICE_ACCOUNT_DISPLAY_NAME: ${APP_SERVICE_ACCOUNT_DISPLAY_NAME:-苍穹集成服务}
      APP_SERVICE_PERMISSIONS: ${APP_SERVICE_PERMISSIONS:-ai:invoke,ai:log:read,module:read}
      APP_STORAGE_ROOT: /app/storage
      APP_AGENT_BASE_URL: http://mock-agent:8090
      APP_AGENT_TIMEOUT_MS: ${APP_AGENT_TIMEOUT_MS:-5000}
      APP_AGENT_MIN_TIMEOUT_MS: ${APP_AGENT_MIN_TIMEOUT_MS:-200}
      APP_AGENT_CONNECT_TIMEOUT_MS: ${APP_AGENT_CONNECT_TIMEOUT_MS:-1500}
      APP_AGENT_PER_ATTEMPT_TIMEOUT_MS: ${APP_AGENT_PER_ATTEMPT_TIMEOUT_MS:-2500}
      APP_AGENT_MAX_ATTEMPTS: ${APP_AGENT_MAX_ATTEMPTS:-3}
      APP_AGENT_RETRY_BACKOFF_MS: ${APP_AGENT_RETRY_BACKOFF_MS:-200}
      APP_AGENT_RETRY_MAX_BACKOFF_MS: ${APP_AGENT_RETRY_MAX_BACKOFF_MS:-1500}
      APP_AGENT_RETRY_JITTER_MS: ${APP_AGENT_RETRY_JITTER_MS:-100}
      APP_AGENT_RATE_LIMIT_MAX_REQUESTS: ${APP_AGENT_RATE_LIMIT_MAX_REQUESTS:-60}
      APP_AGENT_RATE_LIMIT_WINDOW_SECONDS: ${APP_AGENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_AGENT_IDEMPOTENCY_TTL_HOURS: ${APP_AGENT_IDEMPOTENCY_TTL_HOURS:-24}
      APP_AGENT_IDEMPOTENCY_LEASE_GRACE_MS: ${APP_AGENT_IDEMPOTENCY_LEASE_GRACE_MS:-3000}
      APP_AGENT_CLEANUP_INTERVAL_MS: ${APP_AGENT_CLEANUP_INTERVAL_MS:-300000}
      APP_AGENT_MAX_RESPONSE_BYTES: ${APP_AGENT_MAX_RESPONSE_BYTES:-2097152}
      APP_HANDWRITING_BASE_URL: http://handwriting-service:8091
      APP_HANDWRITING_TIMEOUT_MS: ${APP_HANDWRITING_TIMEOUT_MS:-30000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088}
    volumes:
      - app_storage:/app/storage
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./local/frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  postgres_data:
  app_storage:
