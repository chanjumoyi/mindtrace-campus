# 沙盘分析任务流
# 角色B定义 | 版本 1.0.0
# 迁移到苍穹Agent平台后，映射为平台的任务流编排配置

workflow:
  name: sandplay-analysis
  version: "1.0.0"
  description: 沙盘分析完整任务流 —— 从输入验证到分析结果保存
  entryCondition: "收到 POST /api/v1/sandplay/analyze 请求"

  # Agent角色
  agent:
    name: sandplay-analysis-agent
    promptVersion: v1.0.0
    model: platform-default  # 苍穹统一接入模型

  steps:
    - id: validate-input
      name: 输入验证
      type: gate
      description: 校验沙盘元素坐标范围、类别有效性、元素数量上限
      onFailure: return-error
      rules:
        - "elements[].x in [0, 800]"
        - "elements[].y in [0, 600]"
        - "elements[].category in [人物,动物,建筑,植物,自然,交通工具,抽象符号]"
        - "elements.length <= 200"
        - "if elements.length == 0 and userDescription is empty → reject SANDBOX_EMPTY_CANVAS"

    - id: extract-geometric-features
      name: 几何特征提取
      type: tool-call
      tool: sandplay_geometry_service  # Java插件暴露为Agent工具
      inputFrom: validated-elements
      output:
        - categoryDistribution
        - quadrantAnalysis
        - clusters
        - adjacencyEdges
      onFailure: return-error

    - id: retrieve-rag-context
      name: RAG知识检索
      type: tool-call
      tool: get_rag_context
      input:
        topic: sandplay
        query: "沙盘游戏 空间布局 元素象征 解释边界"
        maxResults: 5
      output:
        - documents
      onFailure: continue  # RAG失败不阻塞分析，只是缺少引用

    - id: run-agent-analysis
      name: Agent分析
      type: agent-inference
      input:
        prompt: sandplay-analysis-agent-v1
        variables:
          elements: "$.elements"
          categoryDistribution: "$.categoryDistribution"
          quadrantAnalysis: "$.quadrantAnalysis"
          clusters: "$.clusters"
          adjacencyEdges: "$.adjacencyEdges"
          userDescription: "$.userDescription"
          ragContext: "$.documents"
      output:
        - themeSummary
        - explorationQuestions
        - disclaimer
        - citations
      onFailure: return-error
      timeout: 15000

    - id: content-safety-check
      name: 内容安全检查
      type: post-process
      description: 过滤Agent输出中的诊断术语和PII
      rules:
        - "replace diagnostic terms with neutral alternatives"
        - "mask PII patterns"
        - "verify disclaimer present"
      onFailure: flag-for-review

    - id: save-result
      name: 保存分析结果
      type: tool-call
      tool: save_sandbox_record
      inputFrom: validated-input + agent-output
      idempotencyKey: "$.sessionId + $.timestamp"
      onFailure: retry(3)

    - id: save-audit
      name: 保存审计记录
      type: tool-call
      tool: save_agent_audit
      input:
        agentName: sandplay-analysis-agent
        promptVersion: v1.0.0
        inputSummary: "$.sessionId"
        outputSummary: "$.themeSummary (前100字)"
        toolCalls: ["extract-geometric-features", "retrieve-rag-context", "save-result"]
        latencyMs: "$.totalLatency"
      onFailure: continue  # 审计失败不阻塞主流程

    - id: return-result
      name: 返回结果
      type: output
      schema: SandplayAnalysisResponse
