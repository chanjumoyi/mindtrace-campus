<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心迹AI · 笔迹分析联调页</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #17352d; background: #f3f7f5; }
    body { max-width: 980px; margin: 0 auto; padding: 32px 18px 60px; }
    h1 { margin-bottom: 8px; } .hint { color: #5a6d67; line-height: 1.7; }
    .card { background: white; border: 1px solid #dce8e2; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 8px 24px #163e2f0d; }
    button { border: 0; border-radius: 10px; padding: 11px 18px; background: #167a5b; color: white; cursor: pointer; font-size: 15px; }
    input { margin: 10px 14px 10px 0; } .error { color: #b42318; white-space: pre-wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; }
    .metric { background: #f1f8f5; border-radius: 12px; padding: 14px; } .metric strong { display:block; font-size: 24px; margin-top: 4px; }
    li { margin: 8px 0; line-height: 1.55; } small { color:#60756e; }
  </style>
</head>
<body>
  <h1>笔迹分析联调页</h1>
  <p class="hint">选择采集器导出的 JSON。结果只描述本次书写行为，不用于人格判断、心理诊断或风险筛查。</p>
  <section class="card">
    <input id="file" type="file" accept="application/json,.json">
    <button id="run">分析轨迹</button>
    <p id="error" class="error"></p>
  </section>
  <main id="result" hidden>
    <section class="card"><div id="metrics" class="grid"></div></section>
    <section class="card"><h2>客观观察</h2><ul id="observations"></ul></section>
    <section class="card"><h2>证据引用</h2><ul id="citations"></ul></section>
    <section class="card"><h2>限制说明</h2><ul id="limitations"></ul></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const pct = value => value == null ? "不可用" : `${(value * 100).toFixed(1)}%`;
    $("run").onclick = async () => {
      $("error").textContent = ""; $("result").hidden = true;
      const file = $("file").files[0];
      if (!file) { $("error").textContent = "请先选择一个轨迹 JSON 文件。"; return; }
      try {
        const trace = JSON.parse(await file.text());
        const response = await fetch("/api/v1/handwriting/analyze", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({trace})});
        const envelope = await response.json();
        if (!response.ok || !envelope.success) throw new Error(envelope.message || "分析失败");
        render(envelope.data);
      } catch (error) { $("error").textContent = error.message; }
    };
    function render(data) {
      const scores = data.stateScores;
      $("metrics").innerHTML = [
        ["数据质量", pct(data.dataQuality)], ["结果置信度", pct(data.confidence)],
        ["停顿指标", pct(scores.hesitation)], ["节律波动指标", pct(scores.rhythmInstability)],
        ["设备压力指标", pct(scores.writingTension)], ["状态", data.status]
      ].map(([label,value]) => `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`).join("");
      $("observations").innerHTML = data.observations.map(x => `<li><b>${x.feature}</b>：${x.description}</li>`).join("");
      $("citations").innerHTML = data.citations.map(x => `<li>${x.sourceTitle}，PDF 第 ${x.pdfPage} 页（${x.hypothesisId}）：${x.usage}</li>`).join("");
      $("limitations").innerHTML = data.limitations.map(x => `<li>${x}</li>`).join("");
      $("result").hidden = false;
    }
  </script>
</body>
</html>
