application: xinji-ai
owner: C
version: 1.0.0
scope: 公共框架、数据底座、苍穹适配、系统集成
notes:
  - 该清单用于在具体苍穹租户中建立领域模型；字段编码应在环境基线确认后冻结。
  - 不包含 A 的笔迹业务模型，也不包含 B 的房树人、沙盘与 Agent 业务模型。
models:
  - code: xj_user
    name: 用户公共资料
    sourceTable: app_user
    dataLevel: L2
    fields:
      - {code: id, type: text, required: true, unique: true}
      - {code: username, type: text, required: true, unique: true}
      - {code: display_name, type: text, required: true}
      - {code: email, type: text, required: false}
      - {code: status, type: enum, values: [ACTIVE, DISABLED], required: true}
  - code: xj_common_task
    name: 通用异步任务
    sourceTable: common_task
    dataLevel: L2
    workflow: PENDING -> RUNNING -> SUCCEEDED|FAILED|CANCELLED
    fields:
      - {code: id, type: text, required: true, unique: true}
      - {code: owner_user_id, type: text, required: false}
      - {code: module_code, type: text, required: true}
      - {code: task_type, type: text, required: true}
      - {code: title, type: text, required: true}
      - {code: status, type: enum, values: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED], required: true}
      - {code: progress, type: integer, min: 0, max: 100, required: true}
      - {code: request_ref, type: text, required: false}
      - {code: result_ref, type: text, required: false}
      - {code: error_code, type: text, required: false}
  - code: xj_file_object
    name: 通用文件对象
    sourceTable: file_object
    dataLevel: L2-L4
    fields:
      - {code: id, type: text, required: true, unique: true}
      - {code: owner_user_id, type: text, required: true}
      - {code: module_code, type: text, required: true}
      - {code: original_name, type: text, required: true}
      - {code: content_type, type: text, required: true}
      - {code: size_bytes, type: long, required: true}
      - {code: sha256, type: text, required: true}
      - {code: sensitivity_level, type: enum, values: [L1, L2, L3, L4], required: true}
      - {code: storage_ref, type: attachment, required: true}
  - code: xj_audit_log
    name: 操作审计
    sourceTable: audit_log
    dataLevel: L3
    immutableForBusinessUsers: true
    fields:
      - {code: actor_user_id, type: text}
      - {code: actor_username, type: text}
      - {code: action, type: text, required: true}
      - {code: resource_type, type: text, required: true}
      - {code: resource_id, type: text}
      - {code: result, type: enum, values: [SUCCESS, FAILED], required: true}
      - {code: request_id, type: text}
      - {code: occurred_at, type: datetime, required: true}
  - code: xj_ai_call_log
    name: AI调用审计
    sourceTable: ai_call_log
    dataLevel: L3
    storesRawPrompt: false
    fields:
      - {code: module_code, type: text, required: true}
      - {code: operation, type: text, required: true}
      - {code: status, type: enum, values: [SUCCEEDED, FAILED], required: true}
      - {code: attempts, type: integer, required: true}
      - {code: timeout_ms, type: integer, required: true}
      - {code: latency_ms, type: long, required: true}
      - {code: request_id, type: text}
      - {code: input_digest, type: text}
      - {code: output_digest, type: text}
      - {code: error_code, type: text}
  - code: xj_module_registration
    name: 模块注册
    sourceTable: module_registration
    dataLevel: L2
    fields:
      - {code: module_code, type: text, required: true, unique: true}
      - {code: module_name, type: text, required: true}
      - {code: owner_code, type: enum, values: [A, B, C], required: true}
      - {code: base_url, type: text}
      - {code: health_path, type: text}
      - {code: enabled, type: boolean, required: true}
      - {code: status, type: text, required: true}
      - {code: contract_version, type: text, required: true}
